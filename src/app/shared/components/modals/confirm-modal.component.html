<div class="modal" [class.show]="visible" [style.display]="visible ? 'block' : 'none'">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title | translate }}</h5>
        <button type="button" class="btn-close" (click)="onCancel.emit()"></button>
      </div>
      <div class="modal-body">
        <p>{{ message | translate }}</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" (click)="onCancel.emit()">{{ cancelText | translate }}</button>
        <button class="btn btn-danger" (click)="onConfirm.emit()">{{ confirmText | translate }}</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="visible"></div>
