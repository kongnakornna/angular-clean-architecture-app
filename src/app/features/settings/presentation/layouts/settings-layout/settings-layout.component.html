<div class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h1 class="page-title"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-settings">
	<path stroke="none" d="M0 0h24v24H0z" fill="none" />
	<path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" />
	<path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
</svg> {{ 'settings.title' | translate }}</h1>
      </div>
    </div>
  </div>
</div>

<main class="page-body" id="content">
  <div class="container-xl">
    <div class="card settings-card">
      <div class="row g-0">
        <div class="settings-sidebar-col" [class.collapsed]="sidebarCollapsed">
          <div class="settings-sidebar-toggle">
            <button class="btn btn-icon btn-sm" (click)="toggleSidebar()" [title]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
              <i-tabler [name]="sidebarCollapsed ? 'menu-2' : 'panel-left-close'" class="icon"></i-tabler>
            </button>
          </div>
          <div class="settings-sidebar-content">
            <ng-container *ngFor="let group of menuGroups; let last = last">
              <div class="settings-group" [class.expanded]="isGroupExpanded(group.key)">
                <button class="settings-group-header"
                        (click)="toggleGroup(group.key)"
                        [attr.aria-expanded]="isGroupExpanded(group.key)">
                  <i-tabler [name]="isGroupExpanded(group.key) ? 'chevron-down' : 'chevron-right'" class="settings-group-icon"></i-tabler>
                  <span class="settings-group-label">{{ group.labelKey | translate }}</span>
                </button>
                <div class="settings-group-items" *ngIf="isGroupExpanded(group.key)">
                  <a *ngFor="let item of group.items"
                     [routerLink]="item.route"
                     routerLinkActive="active"
                     class="settings-group-item">
                    <span class="settings-item-label">{{ item.labelKey | translate }}</span>
                  </a>
                </div>
              </div>
              <div class="settings-group-divider" *ngIf="!last"></div>
            </ng-container>
          </div>
        </div>
        <div class="col settings-content-col d-flex flex-column">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</main>
