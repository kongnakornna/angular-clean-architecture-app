<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'settings.sms.name' | translate }}</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.sms.gatewayUrl' | translate }}</label>
        <input type="url" class="form-control" name="gatewayUrl" [(ngModel)]="gatewayUrl" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.sms.apiKey' | translate }}</label>
        <input type="text" class="form-control" name="apiKey" [(ngModel)]="apiKey" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.sms.phone' | translate }}</label>
        <input type="tel" class="form-control" name="phone" [(ngModel)]="phone" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.sms.status' | translate }}</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="status" [(ngModel)]="status" id="status">
          <label class="form-check-label" for="status">{{ status ? ('settings.sms.active' | translate) : ('settings.sms.inactive' | translate) }}</label>
        </div>
      </div>
      <div class="card-footer bg-transparent mt-auto">
        <div class="btn-list justify-content-end">
          <button type="submit" class="btn btn-primary">{{ 'settings.sms.save' | translate }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
