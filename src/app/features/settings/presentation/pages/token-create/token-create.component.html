<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'settings.tokens.name' | translate }}</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.tokens.permissions' | translate }}</label>
        <div class="d-flex gap-3">
          <div class="form-check" *ngFor="let perm of availablePermissions">
            <input class="form-check-input" type="checkbox" [checked]="isPermissionSelected(perm)" (change)="togglePermission(perm)" [id]="'perm_' + perm">
            <label class="form-check-label" [for]="'perm_' + perm">{{ perm }}</label>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.tokens.expiresAt' | translate }}</label>
        <input type="datetime-local" class="form-control" name="expiresAt" [(ngModel)]="expiresAt" required>
      </div>
      <div class="card-footer bg-transparent mt-auto">
        <div class="btn-list justify-content-end">
          <button type="submit" class="btn btn-primary">{{ 'settings.tokens.save' | translate }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
