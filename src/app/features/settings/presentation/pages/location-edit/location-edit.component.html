<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'settings.locations.name' | translate }}</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">{{ 'settings.locations.typeName' | translate }}</label>
          <input type="text" class="form-control" name="typeName" [(ngModel)]="typeName">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'settings.locations.emailId' | translate }}</label>
          <input type="email" class="form-control" name="emailId" [(ngModel)]="emailId">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">{{ 'settings.locations.bucket' | translate }}</label>
          <input type="text" class="form-control" name="bucket" [(ngModel)]="bucket">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'settings.locations.org' | translate }}</label>
          <input type="text" class="form-control" name="org" [(ngModel)]="org">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.locations.deviceCount' | translate }}</label>
        <input type="number" class="form-control" name="deviceCount" [(ngModel)]="deviceCount">
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'settings.locations.status' | translate }}</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="status" [(ngModel)]="status" id="status">
          <label class="form-check-label" for="status">{{ status ? ('settings.locations.active' | translate) : ('settings.locations.inactive' | translate) }}</label>
        </div>
      </div>
      <div class="card-footer bg-transparent mt-auto">
        <div class="btn-list justify-content-end">
          <button type="submit" class="btn btn-primary">{{ 'settings.locations.update' | translate }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
