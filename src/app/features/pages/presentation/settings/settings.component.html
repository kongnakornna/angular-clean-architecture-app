<div class="page-body">
  <div class="container-xl">
    <div class="card">
      <div class="row g-0">
        <div class="col-3 border-end">
          <div class="card-body">
            <div class="nav flex-column nav-pills">
              <a href="#" class="nav-link active">
                <i-tabler name="user" class="icon me-2"></i-tabler>
                Profile
              </a>
              <a href="#" class="nav-link">
                <i-tabler name="mail" class="icon me-2"></i-tabler>
                Email
              </a>
              <a href="#" class="nav-link">
                <i-tabler name="lock" class="icon me-2"></i-tabler>
                Password
              </a>
              <a href="#" class="nav-link">
                <i-tabler name="bell" class="icon me-2"></i-tabler>
                Notifications
              </a>
              <a href="#" class="nav-link">
                <i-tabler name="shield" class="icon me-2"></i-tabler>
                Security
              </a>
            </div>
          </div>
        </div>
        <div class="col-9">
          <div class="card-body">
            <h3 class="card-title">Profile Settings</h3>
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" value="John">
              </div>
              <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" value="Doe">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" value="john.doe&#64;example.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Job Title</label>
              <input type="text" class="form-control" value="Senior Software Engineer">
            </div>
            <div class="mb-3">
              <label class="form-label">Bio</label>
              <textarea class="form-control" rows="3">Full-stack developer passionate about clean architecture.</textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Change Password</label>
              <input type="password" class="form-control" placeholder="Current password">
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <input type="password" class="form-control" placeholder="New password">
              </div>
              <div class="col-md-6">
                <input type="password" class="form-control" placeholder="Confirm new password">
              </div>
            </div>
            <div class="mb-3">
              <div class="form-check form-switch">
                <input type="checkbox" class="form-check-input" id="publicProfile" checked>
                <label class="form-check-label" for="publicProfile">Public profile</label>
                <small class="d-block text-muted">Make your profile visible to everyone</small>
              </div>
            </div>
            <div class="mb-3">
              <div class="form-check form-switch">
                <input type="checkbox" class="form-check-input" id="emailAlerts" checked>
                <label class="form-check-label" for="emailAlerts">Email alerts</label>
                <small class="d-block text-muted">Receive email notifications for account activity</small>
              </div>
            </div>
            <div class="form-footer">
              <button type="submit" class="btn btn-primary">Save Settings</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
