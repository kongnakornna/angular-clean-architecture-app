<div class="card card-md">
  <div class="card-body">
    <h2 class="h2 text-center mb-4">{{ 'login.title' | appTranslate }}</h2>
    <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off" novalidate>
      <div class="mb-3">
        <label class="form-label">{{ 'login.username' | appTranslate }}</label>
        <input type="text" class="form-control" [(ngModel)]="username" name="username" placeholder="{{ 'login.username' | appTranslate }}" autocomplete="username" required>
      </div>
      <div class="mb-2">
        <label class="form-label">
          {{ 'login.password' | appTranslate }}
          <span class="form-label-description">
            <a routerLink="/forgot-password">{{ 'login.forgotPassword' | appTranslate }}</a>
          </span>
        </label>
        <div class="input-group input-group-flat">
          <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="{{ 'login.password' | appTranslate }}" autocomplete="current-password" required>
          <span class="input-group-text">
            <a href="javascript:void(0)" class="link-secondary" [title]="'common.password' | appTranslate" (click)="togglePassword()">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-sm" *ngIf="!passwordVisible">
                <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-sm" *ngIf="passwordVisible">
                <path d="M10.585 10.585a2 2 0 0 0 2.829 2.829" />
                <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" />
                <path d="M3 3l18 18" />
              </svg>
            </a>
          </span>
        </div>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ 'login.submit' | appTranslate }}
        </button>
      </div>
    </form>
  </div>
</div>
<div class="text-center text-secondary mt-3">
  {{ 'login.noAccount' | appTranslate }} <a routerLink="/sign-up" tabindex="-1">{{ 'login.signUp' | appTranslate }}</a>
</div>
