<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">{{ 'auth.resetPassword.title' | appTranslate }}</h2>
        <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>
        <div *ngIf="success" class="alert alert-success mb-3">{{ 'auth.resetPassword.successMessage' | appTranslate }} <a routerLink="/login">{{ 'auth.signUp.loginLink' | appTranslate }}</a></div>
        <form (ngSubmit)="onSubmit()" #resetForm="ngForm" autocomplete="off" novalidate>
          <div class="mb-3">
            <label class="form-label">{{ 'auth.resetPassword.newPassword' | appTranslate }}</label>
            <div class="input-group input-group-flat">
              <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="{{ 'auth.resetPassword.newPasswordPlaceholder' | appTranslate }}" required autocomplete="new-password">
              <span class="input-group-text">
                <a href="javascript:void(0)" class="link-secondary" [title]="'common.password' | appTranslate" (click)="togglePassword()">
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path *ngIf="!passwordVisible" d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
                    <path *ngIf="!passwordVisible" d="M21 12c-2.4 4-5.4 6-9 6c-3.6 0-6.6-2-9-6c2.4-4 5.4-6 9-6c3.6 0 6.6 2 9 6"></path>
                    <path *ngIf="passwordVisible" d="M10.585 10.587a2 2 0 0 0 2.829 2.828"></path>
                    <path *ngIf="passwordVisible" d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0-6.6-2-9-6c1.272-2.12 2.712-3.678 4.32-4.674m2.86-1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11-1.462 2.067-2.388 2.87"></path>
                    <path *ngIf="passwordVisible" d="M3 3l18 18"></path>
                  </svg>
                </a>
              </span>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ 'auth.resetPassword.confirmPassword' | appTranslate }}</label>
            <div class="input-group input-group-flat">
              <input [type]="confirmVisible ? 'text' : 'password'" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="{{ 'auth.resetPassword.confirmPasswordPlaceholder' | appTranslate }}" required autocomplete="new-password">
              <span class="input-group-text">
                <a href="javascript:void(0)" class="link-secondary" [title]="'common.password' | appTranslate" (click)="toggleConfirm()">
                  <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path *ngIf="!confirmVisible" d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path>
                    <path *ngIf="!confirmVisible" d="M21 12c-2.4 4-5.4 6-9 6c-3.6 0-6.6-2-9-6c2.4-4 5.4-6 9-6c3.6 0 6.6 2 9 6"></path>
                    <path *ngIf="confirmVisible" d="M10.585 10.587a2 2 0 0 0 2.829 2.828"></path>
                    <path *ngIf="confirmVisible" d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0-6.6-2-9-6c1.272-2.12 2.712-3.678 4.32-4.674m2.86-1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11-1.462 2.067-2.388 2.87"></path>
                    <path *ngIf="confirmVisible" d="M3 3l18 18"></path>
                  </svg>
                </a>
              </span>
            </div>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" [disabled]="resetForm.invalid || loading || password !== confirmPassword">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ 'auth.resetPassword.submit' | appTranslate }}
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="text-center text-secondary mt-3">
      <a routerLink="/login">{{ 'auth.resetPassword.backToLogin' | appTranslate }}</a>
    </div>
  </div>
</div>
