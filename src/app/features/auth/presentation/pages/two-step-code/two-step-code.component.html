<div class="page page-center">
  <div class="container container-tight py-4">
    <form class="card card-md" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
      <div class="card-body">
        <h2 class="card-title card-title-lg text-center mb-4">{{ 'auth.twoStepCode.title' | translate }}</h2>
        <p class="my-4 text-center">{{ 'auth.twoStepCode.description' | translate }} <strong>+1 856-672-8552</strong></p>
        <div class="my-5">
          <div class="row g-4">
            <div class="col">
              <div class="row g-2">
                <div class="col" *ngFor="let _ of [].constructor(3); let i = index">
                  <input #codeInput type="text" class="form-control form-control-lg text-center px-3 py-3" maxlength="1" inputmode="numeric" pattern="[0-9]*" [(ngModel)]="codes[i]" name="code{{i}}">
                </div>
              </div>
            </div>
            <div class="col">
              <div class="row g-2">
                <div class="col" *ngFor="let _ of [].constructor(3); let i = index">
                  <input #codeInput type="text" class="form-control form-control-lg text-center px-3 py-3" maxlength="1" inputmode="numeric" pattern="[0-9]*" [(ngModel)]="codes[i + 3]" name="code{{i + 3}}">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="my-4">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" [(ngModel)]="dontAskAgain" name="dontAskAgain">
            {{ 'auth.twoStepCode.dontAskAgain' | translate }}
          </label>
        </div>
        <div class="form-footer">
          <div class="btn-list flex-nowrap">
            <a routerLink="/two-step-verification" class="btn w-100">{{ 'auth.twoStepCode.cancel' | translate }}</a>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ 'auth.twoStepCode.confirm' | translate }}
            </button>
          </div>
        </div>
      </div>
    </form>
    <div class="text-center text-secondary mt-3">
      {{ 'auth.twoStepCode.notReceived' | translate }} <a routerLink="/two-step-code">{{ 'auth.twoStepCode.resend' | translate }}</a>
    </div>
  </div>
</div>
