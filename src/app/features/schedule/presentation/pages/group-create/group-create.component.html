<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">{{ 'schedule.groups.createTitle' | translate }}</h2>
    </div>
    <div class="col-auto ms-auto">
      <a routerLink="/schedule/groups" class="btn btn-primary">{{ 'schedule.groups.backToList' | translate }}</a>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'schedule.groups.name' | translate }} <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="name" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'schedule.groups.description' | translate }}</label>
        <textarea class="form-control" [(ngModel)]="description" name="description" rows="3"></textarea>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">{{ 'schedule.groups.sortOrder' | translate }}</label>
          <input type="number" class="form-control" [(ngModel)]="sortOrder" name="sortOrder">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'schedule.groups.status' | translate }}</label>
          <select class="form-select" [(ngModel)]="status" name="status">
            <option value="active">{{ 'schedule.status.active' | translate }}</option>
            <option value="inactive">{{ 'schedule.status.inactive' | translate }}</option>
          </select>
        </div>
      </div>
      <div class="card-footer bg-transparent mt-auto">
        <div class="btn-list justify-content-end">
          <button type="submit" class="btn btn-primary">{{ 'schedule.groups.save' | translate }}</button>
        </div>
      </div>
    </form>
  </div>
</div>
